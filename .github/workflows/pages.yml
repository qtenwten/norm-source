name: Publish N.O.R.M. static Pages bundle

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Terminal contract
        run: npm run test:terminal

      - name: Terminal workstation contract
        run: npm run test:terminal-workstation

      - name: Investigation contract
        run: npm run test:investigation

      - name: N.O.R.M. 2.0 contract
        run: npm run test:norm20

      - name: Build Pages bundle
        run: npm run build:pages

      - name: Stage static site
        run: |
          rm -rf site
          mkdir -p site
          cp -R dist/. site/

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Static site is already up to date."
            exit 0
          fi
          git commit -m "chore: publish N.O.R.M. static site"
          git push origin HEAD:main
