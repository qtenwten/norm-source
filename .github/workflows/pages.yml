name: Publish N.O.R.M. static Pages bundle

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: HTTPS entry contract
        run: npm run test:https-entry

      - name: Audio policy contract
        run: npm run test:audio-policy

      - name: Responsive layout contract
        run: npm run test:responsive

      - name: Route recovery contract
        run: npm run test:route-recovery

      - name: Terminal contract
        run: npm run test:terminal

      - name: Terminal workstation contract
        run: npm run test:terminal-workstation

      - name: Investigation contract
        run: npm run test:investigation

      - name: N.O.R.M. 2.0 contract
        run: npm run test:norm20

      - name: Build Pages bundle
        run: npm run build:pages

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-next
          mkdir -p site-next/assets

          # Previous route chunks are kept for one deployment generation. An already
          # open browser tab can therefore finish a lazy navigation even if a new
          # Pages build lands between the initial shell load and the click.
          OLD_MANIFEST="$(mktemp)"
          if [ -f site/.current-assets.txt ]; then
            cp site/.current-assets.txt "$OLD_MANIFEST"
          elif [ -d site/assets ]; then
            find site/assets -maxdepth 1 -type f -printf '%f\n' | sort > "$OLD_MANIFEST"
          else
            : > "$OLD_MANIFEST"
          fi

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if [ -f "site/assets/$asset" ]; then
              cp "site/assets/$asset" "site-next/assets/$asset"
            fi
          done < "$OLD_MANIFEST"

          cp -R dist/. site-next/
          find dist/assets -maxdepth 1 -type f -printf '%f\n' | sort > site-next/.current-assets.txt

          rm -rf site
          mv site-next site

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Static site is already up to date."
            exit 0
          fi
          git commit -m "chore: publish N.O.R.M. static site"
          git push origin HEAD:main
