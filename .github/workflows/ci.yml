name: N.O.R.M. CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: HTTPS entry contract
        run: npm run test:https-entry

      - name: Audio policy contract
        run: npm run test:audio-policy

      - name: Production audio library contract
        run: npm run test:audio-library

      - name: Responsive layout contract
        run: npm run test:responsive

      - name: Sidebar consistency contract
        run: npm run test:sidebar

      - name: Replay reset contract
        run: npm run test:session-reset

      - name: Route recovery contract
        run: npm run test:route-recovery

      - name: Terminal contract
        run: npm run test:terminal

      - name: Terminal workstation contract
        run: npm run test:terminal-workstation

      - name: Investigation contract
        run: npm run test:investigation

      - name: Navigation semantics contract
        run: npm run test:navigation

      - name: N.O.R.M. 2.0 contract
        run: npm run test:norm20

      - name: Build
        run: npm run build
