<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#07100d" />
    <title>Н.О.Р.М. — внутренний архив</title>
    <script>
      const publishedHost = location.hostname.endsWith('github.io') || location.hostname === 'qsen.ru' || location.hostname === 'www.qsen.ru'
      if (publishedHost && location.protocol === 'http:') {
        location.replace(`https://${location.host}${location.pathname}${location.search}${location.hash}`)
      } else if (publishedHost && !location.pathname.startsWith('/norm-source/site/')) {
        location.replace(`/norm-source/site/${location.hash || ''}`)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
